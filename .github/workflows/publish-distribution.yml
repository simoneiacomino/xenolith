name: Promote prepared distribution

# Manual promotion only. Validation runs without AWS credentials; mutation is
# opt-in and additionally requires the repository deployment gate.
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Full HTTPS URL of the approved metadata-only tar.gz bundle
        required: true
        type: string
      source_base:
        description: HTTPS site base for the installer, using the fixed /distributions route
        required: true
        default: https://xenolith.it/distributions
        type: string
      bundle_sha256:
        description: Approved lowercase SHA-256 of the bundle archive
        required: true
        type: string
      approved_manifest_sha256:
        description: Approved manifest.tsv SHA-256
        required: true
        type: string
      approved_installer_sha256:
        description: Approved install.sh SHA-256
        required: true
        type: string
      distribution_version:
        description: Immutable distribution path segment
        required: true
        type: string
      publish:
        description: Explicitly permit stable installer promotion (repository gate must also be enabled)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUNDLE_URL: ${{ inputs.bundle_url }}
      SOURCE_BASE: ${{ inputs.source_base }}
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
      MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
      INSTALLER_SHA256: ${{ inputs.approved_installer_sha256 }}
      DISTRIBUTION_VERSION: ${{ inputs.distribution_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Download and verify the supplied immutable bundle
        run: |
          python3 - <<'PY'
          import hashlib, os, re, urllib.parse, urllib.request
          from pathlib import Path
          class HttpsRedirect(urllib.request.HTTPRedirectHandler):
              max_redirections = 5
              max_repeats = 2
              def redirect_request(self, request, response, code, message, headers, new_url):
                  if urllib.parse.urlsplit(new_url).scheme != 'https':
                      raise SystemExit('bundle URL redirect away from HTTPS rejected')
                  return super().redirect_request(request, response, code, message, headers, new_url)
          url = os.environ['BUNDLE_URL']
          version = os.environ['DISTRIBUTION_VERSION']
          expected = os.environ['BUNDLE_SHA256']
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('bundle_url must be a full HTTPS URL without credentials/query/fragment')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,127}', version):
              raise SystemExit('distribution_version is not a safe path segment')
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('bundle_sha256 must be lowercase SHA-256')
          request = urllib.request.Request(url, headers={'User-Agent': 'xenolith-distribution-promotion'})
          destination = Path(os.environ['RUNNER_TEMP'], 'distribution.tar.gz')
          hasher = hashlib.sha256()
          total = 0
          opener = urllib.request.build_opener(HttpsRedirect())
          with opener.open(request, timeout=30) as response, destination.open('wb') as output:
              if response.geturl().split(':', 1)[0] != 'https':
                  raise SystemExit('bundle download redirected away from HTTPS')
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  total += len(chunk)
                  if total > 32 * 1024 * 1024:
                      raise SystemExit('metadata bundle exceeds 32 MiB limit')
                  hasher.update(chunk)
                  output.write(chunk)
          actual = hasher.hexdigest()
          if actual != expected:
              raise SystemExit('bundle SHA-256 does not match approved input')
          PY
      - name: Safely unpack flat regular files without running bundle code
        run: |
          python3 - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ['RUNNER_TEMP'], 'distribution.tar.gz')
          output = Path(os.environ['RUNNER_TEMP'], 'distribution')
          output.mkdir()
          allowed = {'install.sh', 'manifest.tsv', 'requirements.tsv', 'gpu-matrix.tsv',
                     'elf-requirements.json', 'provenance.json', 'SHA256SUMS'}
          seen = set()
          total = 0
          with tarfile.open(archive, 'r:gz') as tar:
              for member in tar.getmembers():
                  path = PurePosixPath(member.name)
                  if len(path.parts) != 1 or path.name in ('', '.', '..') or path.is_absolute() or member.name != path.name or '\\' in member.name or any(ord(c) < 32 for c in member.name):
                      raise SystemExit(f'non-flat archive path rejected: {member.name!r}')
                  if member.name not in allowed:
                      raise SystemExit(f'only distribution metadata may be promoted: {member.name!r}')
                  if member.name in seen or not member.isfile():
                      raise SystemExit(f'duplicate or non-regular archive member rejected: {member.name!r}')
                  total += member.size
                  if total > 32 * 1024 * 1024:
                      raise SystemExit('unpacked metadata exceeds 32 MiB limit')
                  seen.add(member.name)
                  source = tar.extractfile(member)
                  if source is None:
                      raise SystemExit(f'cannot read archive member: {member.name!r}')
                  (output / member.name).write_bytes(source.read())
          PY
      - name: Validate distribution and retain exact verified bundle
        env:
          PUBLISH_BUCKET: ${{ vars.DISTRIBUTION_BUCKET || 'validation-only' }}
        run: |
          python3 installer/tools/publish_distribution.py \
            --distribution-dir "$RUNNER_TEMP/distribution" \
            --distribution-version "$DISTRIBUTION_VERSION" \
            --source-base "$SOURCE_BASE" \
            --approved-manifest-sha256 "$MANIFEST_SHA256" \
            --approved-installer-sha256 "$INSTALLER_SHA256" \
            --bucket "$PUBLISH_BUCKET"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: verified-distribution-${{ inputs.distribution_version }}
          path: ${{ runner.temp }}/distribution/
          if-no-files-found: error
          retention-days: 2

  publish:
    if: ${{ inputs.publish && vars.DISTRIBUTION_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    needs: validate-bundle
    concurrency:
      group: xenolith-stable-installer-promotion
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DISTRIBUTION_VERSION: ${{ inputs.distribution_version }}
      SOURCE_BASE: ${{ inputs.source_base }}
      MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
      INSTALLER_SHA256: ${{ inputs.approved_installer_sha256 }}
      PUBLISH_BUCKET: ${{ vars.DISTRIBUTION_BUCKET }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-distribution-${{ inputs.distribution_version }}
          path: ${{ runner.temp }}/distribution
      - name: Revalidate the artifact from this workflow run
        run: |
          python3 installer/tools/publish_distribution.py \
            --distribution-dir "$RUNNER_TEMP/distribution" \
            --distribution-version "$DISTRIBUTION_VERSION" \
            --source-base "$SOURCE_BASE" \
            --approved-manifest-sha256 "$MANIFEST_SHA256" \
            --approved-installer-sha256 "$INSTALLER_SHA256" \
            --bucket "$PUBLISH_BUCKET"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.DISTRIBUTION_AWS_ROLE_ARN }}
          aws-region: ${{ vars.DISTRIBUTION_AWS_REGION }}
      - name: Upload immutable version first, stable installer last
        run: |
          python3 installer/tools/publish_distribution.py \
            --distribution-dir "$RUNNER_TEMP/distribution" \
            --distribution-version "$DISTRIBUTION_VERSION" \
            --source-base "$SOURCE_BASE" \
            --approved-manifest-sha256 "$MANIFEST_SHA256" \
            --approved-installer-sha256 "$INSTALLER_SHA256" \
            --bucket "$PUBLISH_BUCKET" --execute
