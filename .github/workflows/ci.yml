name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential binutils git python3 libze-dev
      - name: Build host CLI with a non-inference kernel placeholder
        run: |
          # These CLI checks never initialize a kernel. Keep the build independent
          # of ocloc and GPU hardware; inference requires a real compiled kernel.
          printf '\003\002\043\007' > xenolith_gpu.spv
          make xenolith_gpu_spv.o
      - name: Check config, installation, and mocked device behavior
        run: make check-config check-install check-devices

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '26'
      - name: Check installer, client integration, and distribution fixtures
        run: make check-installer
