name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential binutils git python3 libze-dev intel-ocloc libigdfcl1 libigc1
      - name: Compile engine and kernels; run host checks
        run: |
          baseline=$(python3 -c 'import sys; sys.path.insert(0, "installer/tools"); from build_baseline import ENGINE_CFLAGS; print(ENGINE_CFLAGS)')
          make OCLOC_DEVICE=tgllp BASE_CFLAGS="$baseline" check-host
      - name: Check snapshots written by historical engine versions
        run: |
          baseline=$(python3 -c 'import sys; sys.path.insert(0, "installer/tools"); from build_baseline import ENGINE_CFLAGS; print(ENGINE_CFLAGS)')
          make OCLOC_DEVICE=tgllp BASE_CFLAGS="$baseline" check-snapshot-compat

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '26'
      - name: Check installer, client integration, and distribution fixtures
        run: make check-installer

  validation-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Python virtual-environment support
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3.12-venv
      - name: Install comparison environment
        run: python3.12 tools/quality/setup_environment.py --profile compare --output /tmp/xe-quality
      - name: Check importer, corpus, metrics, archive and gate outcomes
        run: make check-quality-unit PYTHON=/tmp/xe-quality/bin/python
      - name: Verify committed Google and llama fixture integrity
        run: make verify-quality-fixtures PYTHON=/tmp/xe-quality/bin/python
      - name: Check comparison package outside source tree
        run: |
          cd /tmp
          /tmp/xe-quality/bin/xe-quality --help
          /tmp/xe-quality/bin/python -c 'import sys,xe_quality; assert "jax" not in sys.modules and "torch" not in sys.modules'
      - name: Install CPU reference environment
        run: python3.12 tools/quality/setup_environment.py --profile reference --output /tmp/xe-reference
      - name: Test installed package with all optional unit checks
        env:
          JAX_PLATFORMS: cpu
        run: |
          mkdir -p "$RUNNER_TEMP/validation-installed/tests"
          cp -a tests/quality "$RUNNER_TEMP/validation-installed/tests/quality"
          # Backend tests verify the exact native producer source as test data.
          mkdir -p "$RUNNER_TEMP/validation-installed/tools/quality/native"
          cp tools/quality/native/llama_driver.cpp "$RUNNER_TEMP/validation-installed/tools/quality/native/"
          cd "$RUNNER_TEMP/validation-installed"
          /tmp/xe-reference/bin/python - <<'PYTEST'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests/quality")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PYTEST
