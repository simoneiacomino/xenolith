name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential binutils git python3 libze-dev intel-ocloc libigdfcl1 libigc1
      - name: Compile engine and kernels; run host checks
        run: |
          baseline=$(python3 -c 'import sys; sys.path.insert(0, "installer/tools"); from build_baseline import ENGINE_CFLAGS; print(ENGINE_CFLAGS)')
          make OCLOC_DEVICE=tgllp BASE_CFLAGS="$baseline" check-host
      - name: Check snapshots written by historical engine versions
        run: |
          baseline=$(python3 -c 'import sys; sys.path.insert(0, "installer/tools"); from build_baseline import ENGINE_CFLAGS; print(ENGINE_CFLAGS)')
          make OCLOC_DEVICE=tgllp BASE_CFLAGS="$baseline" check-snapshot-compat

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '26'
      - name: Check installer, client integration, and distribution fixtures
        run: make check-installer
